name: Sincronizar bancos (Open Finance)

# 1) Pede ao site do Meu Pluggy para atualizar os bancos (a API não permite);
# 2) busca as transações novas do Nubank e do Mercado Pago e grava no Firestore.
# Mercado Pago: toda hora. Nubank: 06:00 e 18:00 (Brasília). Também dá para
# disparar manualmente em Actions > "Sincronizar bancos" > Run workflow
# (manual atualiza os dois).
# (O GitHub agenda sozinho: não precisa de git push para o horário funcionar.)
on:
  schedule:
    - cron: '7 * * * *' # a cada hora, no minuto 7 (evita o pico das horas cheias)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-pluggy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Escolher bancos a atualizar
        id: banks
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "09" ] || [ "$HOUR" = "21" ]; then
            echo 'list="Mercado Pago" "Nubank"' >> "$GITHUB_OUTPUT"
          else
            echo 'list="Mercado Pago"' >> "$GITHUB_OUTPUT"
          fi

      - name: Cache do Chromium (Playwright)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Guarda a sessão do Meu Pluggy entre execuções: o robô só faz login de novo
      # (com e-mail e senha) quando ela expira, em vez de logar toda hora.
      - name: Restaurar sessão do Meu Pluggy
        uses: actions/cache@v4
        with:
          path: .auth
          key: meupluggy-session-${{ github.run_id }}
          restore-keys: meupluggy-session-

      - name: Atualizar no Meu Pluggy
        id: refresh
        continue-on-error: true # se falhar, ainda sincroniza com o que já existe
        run: node scripts/meupluggy-refresh.mjs refresh ${{ steps.banks.outputs.list }}
        env:
          MEUPLUGGY_STORAGE_STATE: ${{ secrets.MEUPLUGGY_STORAGE_STATE }}
          MEUPLUGGY_EMAIL: ${{ secrets.MEUPLUGGY_EMAIL }}
          MEUPLUGGY_PASSWORD: ${{ secrets.MEUPLUGGY_PASSWORD }}

      - name: Sincronizar
        run: node scripts/sync-pluggy.mjs
        env:
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_ITEM_IDS: ${{ secrets.PLUGGY_ITEM_IDS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SYNC_USER_EMAIL: ${{ secrets.SYNC_USER_EMAIL }}

      # Deixa a execução vermelha (e o GitHub te avisa por e-mail) se a
      # atualização no Meu Pluggy falhou, por exemplo sessão expirada.
      - name: Avisar se a atualização falhou
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::A atualização no Meu Pluggy falhou (veja a etapa acima). Se for login: confira os secrets MEUPLUGGY_EMAIL e MEUPLUGGY_PASSWORD (ou se o site pediu verificação extra)."
          exit 1
